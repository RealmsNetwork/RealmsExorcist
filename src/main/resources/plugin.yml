name: RealmsExorcist
version: 1.1.0
main: net.realmsnetwork.exorcist.RealmsExorcist
api-version: '1.21'
description: Server diagnostics and safe configuration recovery for Paper and compatible servers.
author: RealmsNetwork
commands:
  exorcist:
    description: Run server diagnostics and safe maintenance tasks.
    usage: /exorcist <scan|logs|doctor|repair|reload>
    aliases: [rex, exorcism]
    permission: realmsexorcist.use
permissions:
  realmsexorcist.use:
    description: Allows running RealmsExorcist diagnostics.
    default: op
  realmsexorcist.admin:
    description: Allows configuration reload and confirmed recovery actions.
    default: op
