settings:
  scan-on-enable: true
  scan-log-lines: 2500
  max-log-findings: 30
  show-clean-checks: false
checks:
  dependencies: true
  compatibility: true
  configuration-files: true
  proxy: true
  recent-logs: true
  memory: true
limits:
  max-config-files: 200
  max-config-size-kib: 512
  max-total-config-mib: 32
